name: Build iOS Devotee App (Jay Ho Gurudev)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build JayHoGurudev iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Show Xcode Version & SDKs
        run: |
          xcodebuild -version
          xcrun simctl list devicetypes

      - name: Build JayHoGurudev for iOS Simulator
        run: |
          xcodebuild clean build \
            -project JayHoGurudev.xcodeproj \
            -scheme JayHoGurudev \
            -destination "platform=iOS Simulator,name=iPhone 15,OS=latest" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build Generic iOS Device Archive (Release)
        run: |
          xcodebuild archive \
            -project JayHoGurudev.xcodeproj \
            -scheme JayHoGurudev \
            -destination "generic/platform=iOS" \
            -archivePath build/JayHoGurudev.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa Binary for Direct Sideloading
        run: |
          mkdir -p build/Payload
          cp -r build/JayHoGurudev.xcarchive/Products/Applications/JayHoGurudev.app build/Payload/
          cd build
          zip -r JayHoGurudev.ipa Payload
          cd ..

      - name: Upload .ipa Binary for iPhone Installation
        uses: actions/upload-artifact@v4
        with:
          name: JayHoGurudev-iOS-App-IPA
          path: build/JayHoGurudev.ipa

      - name: Upload Full Xcode Archive
        uses: actions/upload-artifact@v4
        with:
          name: JayHoGurudev-iOS-Archive
          path: build/JayHoGurudev.xcarchive
